name: Verify model evidence
on: [push, pull_request]
jobs:
  evidence:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python verify_model.py assets/pagoda
      - run: python verify_model.py assets/pavilion
      - run: python adversarial_critic_loop.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: node --check viewer.mjs
  blender-rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pavilion/blender-5.0.1-linux-x64
          key: blender-5.0.1-linux-x64-8019580ee1b7262e
      - name: Install verified Blender 5.0.1 runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.cache/pavilion"
          if [ ! -x "$HOME/.cache/pavilion/blender-5.0.1-linux-x64/blender" ]; then
            curl --fail --location --retry 3 https://download.blender.org/release/Blender5.0/blender-5.0.1-linux-x64.tar.xz --output /tmp/blender.tar.xz
            echo "8019580ee1b7262e505f4196a00237ccf743c88d205b38d34201510676e60b09  /tmp/blender.tar.xz" | sha256sum --check
            tar -xJf /tmp/blender.tar.xz --directory "$HOME/.cache/pavilion"
          fi
          echo "$HOME/.cache/pavilion/blender-5.0.1-linux-x64" >> "$GITHUB_PATH"
      - run: blender -b -t 2 --python-exit-code 1 -P generate_pagoda_bpy.py -- params/pavilion.json reports/ci-pavilion
        timeout-minutes: 12
      - run: python3 verify_model.py reports/ci-pavilion
      - uses: actions/upload-artifact@v4
        with:
          name: rebuilt-pavilion
          path: |
            reports/ci-pavilion/*.png
            reports/ci-pavilion/*.json
            reports/ci-pavilion/*.glb
